name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  SCHEME: Mac7Zip
  PROJECT: Mac7Zip.xcodeproj
  APP_NAME: Mac7Zip

jobs:
  build:
    name: Build & Test (macOS 26, arm64)
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26 and verify toolchain
        run: |
          set -euo pipefail
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode*.app 2>/dev/null || true

          XCODE_APP="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "$XCODE_APP" ]; then
            XCODE_APP="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          fi
          if [ -n "$XCODE_APP" ]; then
            echo "Selecting $XCODE_APP"
            sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          fi

          echo "--- xcodebuild -version ---"
          xcodebuild -version
          XCODE_VERSION="$(xcodebuild -version | awk 'NR==1 {print $2}')"
          echo "Xcode version: $XCODE_VERSION"
          if [[ "$XCODE_VERSION" != 26.* ]]; then
            echo "::error::Expected Xcode 26.x but found $XCODE_VERSION"
            exit 1
          fi

          echo "--- swift --version ---"
          swift --version

      - name: Install XcodeGen
        run: |
          brew update >/dev/null 2>&1 || true
          brew install xcodegen
          xcodegen --version

      - name: Verify toolchain pins (TKT-M6-08)
        run: |
          set -euo pipefail
          . ./versions.env
          echo "Pinned Xcode:     $XCODE_VERSION"
          echo "Pinned XcodeGen:  $XCODEGEN_VERSION"
          echo "Pinned 7zz:       $SEVENZIP_VERSION"
          ACTUAL_XCODEGEN="$(xcodegen --version 2>/dev/null | grep -oE '[0-9]+\.[0-9.]+' | head -1 || echo unknown)"
          echo "Installed XcodeGen: $ACTUAL_XCODEGEN"
          test -n "$XCODEGEN_VERSION"
          # 7zz pinned version must match the vendored directory
          test -d "Vendor/7zz/$SEVENZIP_VERSION" || { echo "::error::vendored 7zz $SEVENZIP_VERSION missing"; exit 1; }

      - name: Generate Xcode project
        run: |
          xcodegen generate --spec project.yml
          ls -la

      - name: Compile check (Debug)
        run: |
          set -o pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee build-debug.log

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            test | tee test.log

      - name: Release build (universal arm64 + x86_64)
        run: |
          set -o pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee build-release.log

      - name: Verify vendored 7zz
        run: ./scripts/verify-7zz.sh

      - name: Lint (non-blocking)
        continue-on-error: true
        run: |
          echo "--- swift-format lint (non-blocking) ---"
          swift format lint --strict --recursive Sources Tests 2>&1 | head -60 || true
          echo "--- SwiftLint (non-blocking) ---"
          if command -v swiftlint >/dev/null 2>&1; then
            swiftlint lint --quiet 2>&1 | head -60 || true
          else
            echo "swiftlint not installed; skipping"
          fi

      - name: Verify architecture and dependencies
        run: |
          set -euo pipefail
          BINARY="build/Build/Products/Release/${APP_NAME}.app/Contents/MacOS/${APP_NAME}"
          if [ ! -f "$BINARY" ]; then
            echo "::error::Executable not found at $BINARY"
            exit 1
          fi
          echo "--- lipo -info ---"
          lipo -info "$BINARY"
          ARCHS_FOUND="$(lipo -archs "$BINARY")"
          echo "archs: $ARCHS_FOUND"
          case "$ARCHS_FOUND" in
            *arm64*) echo "arm64 present" ;;
            *) echo "::error::arm64 missing from binary"; exit 1 ;;
          esac
          case "$ARCHS_FOUND" in
            *x86_64*) echo "x86_64 present" ;;
            *) echo "::error::x86_64 missing (universal build required, TKT-M6-03)"; exit 1 ;;
          esac
          echo "--- otool -L ---"
          otool -L "$BINARY"

      - name: Package .app into ZIP
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release/${APP_NAME}.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::Expected app at $APP_PATH was not produced"
            find build -maxdepth 6 -name "*.app" -print || true
            exit 1
          fi
          echo "--- bundling 7zz helper ---"
          ./scripts/bundle-7zz.sh "$APP_PATH" universal
          lipo -info "$APP_PATH/Contents/Helpers/7zz"
          "$APP_PATH/Contents/Helpers/7zz" i | head -12

          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "${APP_NAME}-universal.zip"
          ls -lh "${APP_NAME}-universal.zip"
          echo "--- archive contents (top) ---"
          /usr/bin/unzip -l "${APP_NAME}-universal.zip" | head -40

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-universal
          path: ${{ env.APP_NAME }}-universal.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build-debug.log
            test.log
            build-release.log
          if-no-files-found: ignore
