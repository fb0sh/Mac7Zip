name: Mac7Zip

options:
  bundleIdPrefix: com.mac7zip
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    MACOSX_DEPLOYMENT_TARGET: "26.0"

targets:
  Mac7Zip:
    type: application
    platform: macOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mac7zip.Mac7Zip
        PRODUCT_NAME: Mac7Zip
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_HARDENED_RUNTIME: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Mac7Zip
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.utilities
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: "Copyright © 2026 Mac7Zip contributors."
        CFBundleDocumentTypes:
          - CFBundleTypeName: Archive
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - org.7-zip.7-zip-archive
              - public.zip-archive
              - public.tar-archive
              - org.gnu.gnu-zip-archive
              - org.gnu.gnu-zip-tar-archive
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.7-zip.7-zip-archive
            UTTypeDescription: 7-Zip Archive
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [7z]
          - UTTypeIdentifier: org.gnu.gnu-zip-archive
            UTTypeDescription: Gzip Archive
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [gz]
          - UTTypeIdentifier: org.gnu.gnu-zip-tar-archive
            UTTypeDescription: Gzipped Tar Archive
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [tgz]
        NSServices:
          - NSMenuItem: {default: Open Archive}
            NSMessage: openArchiveService
            NSSendFileTypes: [public.data]
          - NSMenuItem: {default: Extract Here}
            NSMessage: extractHereService
            NSSendFileTypes: [public.data]
          - NSMenuItem: {default: Extract to Folder}
            NSMessage: extractToFolderService
            NSSendFileTypes: [public.data]
          - NSMenuItem: {default: Test Archive}
            NSMessage: testArchiveService
            NSSendFileTypes: [public.data]
          - NSMenuItem: {default: Add to Archive}
            NSMessage: addToArchiveService
            NSSendFileTypes: [public.data]
        CFBundleURLTypes:
          - CFBundleURLName: com.mac7zip.URL
            CFBundleURLSchemes: [mac7zip]

  Mac7ZipTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/Mac7ZipTests
      - path: Tests/Mac7ZipTests/Fixtures
        buildPhase: resources
      # Core sources are compiled into the test bundle so tests run host-free
      # (no app launch, no TEST_HOST) while staying in the same module.
      - path: Sources/Models
      - path: Sources/FileSystem
      - path: Sources/Archive
      - path: Sources/State
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mac7zip.Mac7ZipTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Mac7Zip:
    build:
      targets:
        Mac7Zip: all
        Mac7ZipTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - Mac7ZipTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
